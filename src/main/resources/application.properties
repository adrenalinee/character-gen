spring.application.name=character-gen2

server.port=9000

logging.pattern.console=%clr(%date{${LOG_DATEFORMAT_PATTERN:yyyy-MM-dd HH:mm:ss.SSS}}){faint} %clr(${LOG_LEVEL_PATTERN:%5level}) %clr([%15.15thread]){faint} %clr(%-50.50logger{49}){yellow} %clr(%class.%method\\(%file:%line\\)){cyan} %clr(:){faint} %message%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.TRACER_LOG=INFO
logging.level.TRACER_DETAIL_LOG=DEBUG

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# OpenAI Java client reads OPENAI_API_KEY (and optional organization/project/base URL) from the environment.
openai.model=${OPENAI_MODEL:gpt-5.6-luna}
openai.generation.max-concurrency=${OPENAI_GENERATION_MAX_CONCURRENCY:4}

# 캐릭터 런타임 대화(검증용). 세션은 서버 메모리에만 존재한다.
# 검증 대상은 실제 배포에 쓸 모델이어야 하므로 OPENAI_CHAT_MODEL을 반드시 지정한다.
openai.chat.model=${OPENAI_CHAT_MODEL:${openai.model}}
character-chat.session.ttl=PT30M
character-chat.session.max-count=100
character-chat.session.max-concurrency=4
character-chat.session.sweep-interval-millis=60000
character-chat.stream.timeout=PT5M
character-chat.include-voice-samples=true
spring.mvc.async.request-timeout=300000
