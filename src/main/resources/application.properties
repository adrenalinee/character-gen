spring.application.name=character-gen2

server.port=9000

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# OpenAI Java client reads OPENAI_API_KEY (and optional organization/project/base URL) from the environment.
openai.model=${OPENAI_MODEL:gpt-5.6-terra}
openai.generation.max-concurrency=${OPENAI_GENERATION_MAX_CONCURRENCY:4}
